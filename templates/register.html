<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | Campus Innovate Hub</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .box {
        background: white;
        width: 350px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }

      h1 {
        text-align: center;
        color: #2563eb;
      }

      h2 {
        text-align: center;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        margin-bottom: 15px;
        box-sizing: border-box;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      a {
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>Campus Innovate Hub</h1>
      <h2>Create Account</h2>

      <form method="POST">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name" required />

        <label>Email</label>
        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          required
        />

        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Create password"
          required
        />

        <label>Role</label>
        <select name="role">
          <option value="student">Student</option>
          <option value="mentor">Mentor</option>
        </select>

        <button type="submit">Create Account</button>
      </form>

      <p>
        Already have an account?
        <a href="/login">Login</a>
      </p>

      <a href="/">← Back to Home</a>
    </div>
  </body>
</html>
