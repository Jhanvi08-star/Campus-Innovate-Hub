<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Campus Innovate Hub</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      .auth-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        padding: 20px;
      }
      .auth-card {
        background: white;
        padding: 36px;
        border-radius: 18px;
        border: 1px solid #e2e8f0;
        width: 100%;
        max-width: 430px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      }
      .auth-card h1 {
        color: #2563eb;
        text-align: center;
        font-size: 24px;
        margin-bottom: 6px;
      }
      .auth-card h2 {
        text-align: center;
        font-size: 21px;
        margin-bottom: 10px;
      }
      .auth-card label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
        font-size: 14px;
      }
      .auth-card input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .auth-card button {
        width: 100%;
        margin-top: 18px;
        background: #2563eb;
        color: white;
        border: none;
        padding: 13px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
      }
      .flash-msg {
        background: #dcfce7;
        color: #166534;
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 13.5px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Campus Innovate Hub</h1>
        <h2>🔒 Set New Password</h2>
        <p
          style="
            text-align: center;
            color: #64748b;
            font-size: 13.5px;
            margin-bottom: 16px;
          "
        >
          Enter the 6-digit OTP sent to <strong>{{ email }}</strong>
        </p>

        {% with messages = get_flashed_messages() %} {% if messages %} {% for
        msg in messages %}
        <div class="flash-msg">{{ msg }}</div>
        {% endfor %} {% endif %} {% endwith %}

        <form method="POST">
          <label>6-Digit OTP</label>
          <input
            type="text"
            name="otp"
            maxlength="6"
            placeholder="e.g. 482910"
            required
            style="letter-spacing: 4px; font-weight: 700; text-align: center"
          />

          <label>New Password</label>
          <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            required
          />

          <button type="submit">Reset Password ✓</button>
        </form>
      </div>
    </div>
  </body>
</html>
